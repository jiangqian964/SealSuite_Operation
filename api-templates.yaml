version: 1
templates:
  # ============================================================
  # 飞连 Open API 常用模板
  # 设计说明：
  #   - 所有列表类接口均需分页参数 page + page_size
  #     （飞连 OpenAPI 对这类接口要求必填，缺省时返回 code=40000）
  #   - default_query 即为每次调用时自动注入的默认 query 参数
  #   - 调用者可通过 ExecuteRequest.Query 覆盖同名参数
  # ============================================================

  # ---------- 设备 (device) ----------

  - id: personal_devices_list
    name: 个人设备-列表
    category: device
    method: GET
    path: /api/open/v1/device/personal
    default_query:
      page: "1"
      page_size: "10"

  - id: device_statistics
    name: 设备-统计
    category: device
    method: GET
    path: /api/open/v1/device/statistics
    default_query:
      page: "1"
      page_size: "10"

  # ---------- 部门 (department) ----------

  - id: department_list
    name: 部门-列表
    category: department
    method: GET
    path: /api/open/v1/department/list
    default_query:
      page: "1"
      page_size: "10"
